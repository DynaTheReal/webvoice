<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebVoice mit Lobbys</title>
    <!-- iOS Vollbild-Modus Meta-Tags für iPad & iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WebVoice">
    <style>
        :root {
            --glow-color: #0b57d0;
            --gui-opacity: 0.85;
            --gui-bg: rgba(30, 31, 32, var(--gui-opacity));
            --gui-card-bg: rgba(40, 42, 44, var(--gui-opacity));
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #131314;
            color: #e3e3e3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            overflow-x: hidden;
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            display: none;
        }

        .chat-container {
            position: relative;
            width: 100%;
            max-width: 550px;
            background-color: var(--gui-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: box-shadow 0.4s ease, border-color 0.4s ease, background-color 0.2s ease;
            z-index: 1;
        }

        .chat-container.glow-active {
            box-shadow: 0 0 25px 2px var(--glow-color), 0 0 50px -5px var(--glow-color);
            border-color: var(--glow-color);
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .app-header h2 {
            margin-bottom: 0;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #c4c7c5;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 50%;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .icon-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .settings-modal {
            display: none;
            position: absolute;
            top: 60px;
            right: 24px;
            background-color: var(--gui-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 16px;
            width: 260px;
            z-index: 100;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            transition: background-color 0.2s ease;
        }

        .settings-modal.open {
            display: block;
        }

        .settings-section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #a8c7fa;
            margin: 12px 0 6px 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .settings-section-title:first-child {
            margin-top: 0;
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        .opacity-slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
        }

        .file-input-btn {
            display: inline-block;
            padding: 8px 12px;
            font-size: 0.8rem;
            background-color: rgba(255, 255, 255, 0.1);
            color: #a8c7fa;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            width: 100%;
            margin-bottom: 6px;
            transition: background-color 0.2s ease;
        }

        .file-input-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .reset-bg-btn {
            background: transparent;
            color: #ff6b6b;
            border: none;
            font-size: 0.75rem;
            cursor: pointer;
            width: 100%;
            text-align: right;
            padding: 2px 0;
        }

        .color-picker {
            -webkit-appearance: none;
            appearance: none;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
        }

        .color-picker::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker::-webkit-color-swatch {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.2);
            transition: .3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #0b57d0;
        }

        input:checked + .slider:before {
            transform: translateX(18px);
        }

        h2, h3 {
            text-align: center;
            font-weight: 500;
            color: #f1f3f4;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--gui-card-bg);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input:focus {
            border-color: #a8c7fa;
        }

        input::placeholder {
            color: #8e918f;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #0b57d0;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #1b66c9;
        }

        .secondary-btn {
            background-color: transparent;
            color: #a8c7fa;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .secondary-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .delete-btn {
            background-color: #a50e0e;
            color: white;
            padding: 8px 12px;
            font-size: 0.8rem;
        }

        .delete-btn:hover {
            background-color: #b3261e;
        }

        .toggle-text {
            text-align: center;
            margin-top: 14px;
            font-size: 0.85rem;
            color: #c4c7c5;
        }

        .toggle-link {
            color: #a8c7fa;
            cursor: pointer;
            text-decoration: underline;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--gui-card-bg);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: #c4c7c5;
        }

        .header-bar span {
            color: #a8c7fa;
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .help-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #8e918f;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 0.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            transition: all 0.2s ease;
        }

        .help-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-color: #a8c7fa;
        }

        .lobby-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .lobby-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--gui-card-bg);
            padding: 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .lobby-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lobby-buttons {
            display: flex;
            gap: 8px;
        }

        .lobby-card button {
            width: auto;
            padding: 8px 16px;
        }

        /* --- VOICE CHAT SPEZIFISCHE STYLES --- */
        .voice-participants-container {
            min-height: 200px;
            max-height: 350px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
            padding: 8px;
        }

        .participant-card {
            background-color: var(--gui-card-bg);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
            transition: border-color 0.2s ease;
        }

        .participant-card.speaking {
            border-color: #34a853;
            box-shadow: 0 0 10px rgba(52, 168, 83, 0.4);
        }

        .participant-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #0b57d0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
            font-weight: bold;
        }

        .participant-name {
            font-size: 0.85rem;
            color: #e3e3e3;
            word-break: break-word;
        }

        .voice-controls {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .voice-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .voice-btn.active {
            background-color: #a50e0e;
            color: white;
        }

        #auth-section, #lobby-section, #voice-section, #admin-create-lobby {
            display: none;
        }
    </style>
</head>
<body>

<video id="bg-video" autoplay loop muted playsinline></video>

<div class="chat-container" id="main-container">
    <div class="app-header">
        <h2>WebVoice</h2>
        <button id="btn-toggle-settings" class="icon-btn" title="Einstellungen">⚙️</button>
    </div>

    <!-- EINSTELLUNGEN POPUP -->
    <div id="settings-modal" class="settings-modal">
        <div class="settings-section-title">Glow Effekt</div>
        <div class="settings-row">
            <span>Aktivieren</span>
            <label class="switch">
                <input type="checkbox" id="glow-toggle">
                <span class="slider"></span>
            </label>
        </div>
        <div class="settings-row">
            <span>Glow-Farbe</span>
            <input type="color" id="glow-color-picker" class="color-picker" value="#0b57d0">
        </div>

        <div class="settings-section-title">Glas & Transparenz</div>
        <div class="settings-row" style="flex-direction: column; align-items: flex-start; gap: 6px;">
            <div style="display: flex; justify-content: space-between; width: 100%; font-size: 0.85rem;">
                <span>Sichtbarkeit</span>
                <span id="opacity-value">85%</span>
            </div>
            <input type="range" id="opacity-slider" class="opacity-slider" min="0" max="1" step="0.05" value="0.85">
        </div>

        <div class="settings-section-title">Hintergrund</div>
        <label for="bg-file-input" class="file-input-btn">🎥 Video / Bild wählen</label>
        <input type="file" id="bg-file-input" accept="image/*,video/*" style="display: none;">
        <button id="btn-reset-bg" class="reset-bg-btn">Hintergrund zurücksetzen</button>
    </div>

    <!-- AUTHENTIFIZIERUNG -->
    <div id="auth-section">
        <div class="input-group">
            <input type="text" id="username" placeholder="Benutzername">
            <input type="email" id="email" placeholder="E-Mail-Adresse">
            <input type="password" id="password" placeholder="Passwort (mind. 6 Zeichen)">
        </div>
        <button id="btn-auth">Einloggen</button>
        <div class="toggle-text">
            <span id="toggle-prompt">Noch kein Konto?</span> 
            <span id="toggle-action" class="toggle-link">Jetzt registrieren</span>
        </div>
    </div>

    <!-- LOBBY AUSWAHL -->
    <div id="lobby-section">
        <div class="header-bar">
            <div>Angemeldet als: <span id="user-display"></span></div>
            <div class="header-actions">
                <button id="btn-show-uid" class="help-btn" title="Eigene UID anzeigen">?</button>
                <button id="btn-logout" class="secondary-btn" style="width: auto; padding: 4px 10px; margin: 0; font-size: 0.8rem;">Abmelden</button>
            </div>
        </div>

        <h3>Verfügbare Voice-Räume</h3>
        <div id="lobby-list" class="lobby-list"></div>

        <div id="admin-create-lobby" style="margin-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 16px;">
            <h3>Neuen Raum erstellen (Admin)</h3>
            <div class="input-group">
                <input type="text" id="new-lobby-name" placeholder="Raum Name">
                <input type="password" id="new-lobby-password" placeholder="Raum Passwort">
            </div>
            <button id="btn-create-lobby">Raum Erstellen</button>
        </div>
    </div>

    <!-- VOICE CHAT BEREICH -->
    <div id="voice-section">
        <div class="header-bar">
            <div>Raum: <span id="current-lobby-display"></span></div>
            <button id="btn-leave-lobby" class="secondary-btn" style="width: auto; padding: 4px 10px; margin: 0; font-size: 0.8rem;">Raum verlassen</button>
        </div>
        
        <div id="voice-participants" class="voice-participants-container">
            <!-- Teilnehmer werden hier dynamsich eingefügt -->
        </div>

        <div class="voice-controls">
            <button id="btn-toggle-mic" class="voice-btn" title="Mikrofon stummschalten">🎙️</button>
            <button id="btn-toggle-deafen" class="voice-btn" title="Audio stummschalten">🎧</button>
        </div>

        <div id="audio-containers"></div>
    </div>
</div>

<!-- FIREBASE SKRIPT -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
        getAuth, 
        createUserWithEmailAndPassword, 
        signInWithEmailAndPassword, 
        updateProfile,
        onAuthStateChanged, 
        signOut 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { 
        getFirestore, 
        collection, 
        addDoc, 
        doc,
        getDoc,
        setDoc,
        deleteDoc,
        onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const ADMIN_UID = "HIER_DEINE_FIREBASE_UID_EINFUEGEN"; 

    const firebaseConfig = {
      apiKey: "AIzaSyD5funl7uYInXXMBGpqmjp0O7c0tqhBNw0",
      authDomain: "webchat-1c480.firebaseapp.com",
      projectId: "webchat-1c480",
      storageBucket: "webchat-1c480.firebasestorage.app",
      messagingSenderId: "149320504905",
      appId: "1:149320504905:web:501f24bdf3846d32b15198",
      measurementId: "G-LN66CN39SJ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let isRegisterMode = false;
    let currentLobbyId = null;
    let isAdmin = false;
    let localStream = null;
    let isMuted = false;
    let isDeafened = false;

    const peerConnections = {};

    // --- EINSTELLUNGEN LOGIK ---
    const mainContainer = document.getElementById('main-container');
    const settingsModal = document.getElementById('settings-modal');
    const btnToggleSettings = document.getElementById('btn-toggle-settings');
    const glowToggle = document.getElementById('glow-toggle');
    const glowColorPicker = document.getElementById('glow-color-picker');
    const opacitySlider = document.getElementById('opacity-slider');
    const opacityValue = document.getElementById('opacity-value');
    const bgFileInput = document.getElementById('bg-file-input');
    const bgVideo = document.getElementById('bg-video');
    const btnResetBg = document.getElementById('btn-reset-bg');

    const savedGlowEnabled = localStorage.getItem('glowEnabled') === 'true';
    const savedGlowColor = localStorage.getItem('glowColor') || '#0b57d0';
    glowToggle.checked = savedGlowEnabled;
    glowColorPicker.value = savedGlowColor;
    document.documentElement.style.setProperty('--glow-color', savedGlowColor);
    if (savedGlowEnabled) mainContainer.classList.add('glow-active');

    const savedOpacity = localStorage.getItem('guiOpacity') !== null ? localStorage.getItem('guiOpacity') : '0.85';
    opacitySlider.value = savedOpacity;
    updateOpacity(savedOpacity);

    const savedBgData = localStorage.getItem('customBgData');
    const savedBgType = localStorage.getItem('customBgType');

    if (savedBgData && savedBgType) {
        applyBackground(savedBgData, savedBgType);
    }

    btnToggleSettings.addEventListener('click', (e) => {
        e.stopPropagation();
        settingsModal.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
        if (!settingsModal.contains(e.target) && e.target !== btnToggleSettings) {
            settingsModal.classList.remove('open');
        }
    });

    glowToggle.addEventListener('change', (e) => {
        const isEnabled = e.target.checked;
        localStorage.setItem('glowEnabled', isEnabled);
        if (isEnabled) {
            mainContainer.classList.add('glow-active');
        } else {
            mainContainer.classList.remove('glow-active');
        }
    });

    glowColorPicker.addEventListener('input', (e) => {
        const color = e.target.value;
        document.documentElement.style.setProperty('--glow-color', color);
        localStorage.setItem('glowColor', color);
    });

    opacitySlider.addEventListener('input', (e) => {
        const val = e.target.value;
        updateOpacity(val);
        localStorage.setItem('guiOpacity', val);
    });

    function updateOpacity(val) {
        document.documentElement.style.setProperty('--gui-opacity', val);
        opacityValue.textContent = Math.round(val * 100) + '%';
    }

    bgFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const dataUrl = event.target.result;
            const fileType = file.type.startsWith('video/') ? 'video' : 'image';

            try {
                localStorage.setItem('customBgData', dataUrl);
                localStorage.setItem('customBgType', fileType);
            } catch (err) {
                alert("Datei zu groß für den dauerhaften Speicher.");
            }

            applyBackground(dataUrl, fileType);
        };
        reader.readAsDataURL(file);
    });

    btnResetBg.addEventListener('click', () => {
        localStorage.removeItem('customBgData');
        localStorage.removeItem('customBgType');
        bgVideo.pause();
        bgVideo.style.display = 'none';
        bgVideo.src = '';
        document.body.style.backgroundImage = 'none';
    });

    function applyBackground(dataUrl, type) {
        if (type === 'video') {
            document.body.style.backgroundImage = 'none';
            bgVideo.src = dataUrl;
            bgVideo.style.display = 'block';
            bgVideo.muted = true;
            bgVideo.play().catch(e => console.log("Video Playback Info:", e));
        } else {
            bgVideo.pause();
            bgVideo.style.display = 'none';
            bgVideo.src = '';
            document.body.style.backgroundImage = `url('${dataUrl}')`;
        }
    }

    // --- FIREBASE & VOICE LOGIK ---
    function getSavedLobbies() {
        return JSON.parse(localStorage.getItem("savedLobbies") || "{}");
    }

    function saveLobbyAccess(lobbyId, password) {
        const saved = getSavedLobbies();
        saved[lobbyId] = password;
        localStorage.setItem("savedLobbies", JSON.stringify(saved));
    }

    const authSection = document.getElementById('auth-section');
    const lobbySection = document.getElementById('lobby-section');
    const voiceSection = document.getElementById('voice-section');
    const usernameInput = document.getElementById('username');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const btnAuth = document.getElementById('btn-auth');
    const togglePrompt = document.getElementById('toggle-prompt');
    const toggleAction = document.getElementById('toggle-action');
    const userDisplay = document.getElementById('user-display');
    const adminCreateLobby = document.getElementById('admin-create-lobby');
    const lobbyListDiv = document.getElementById('lobby-list');
    const currentLobbyDisplay = document.getElementById('current-lobby-display');
    const participantsDiv = document.getElementById('voice-participants');

    usernameInput.style.display = "none";

    toggleAction.addEventListener('click', () => {
        isRegisterMode = !isRegisterMode;
        if (isRegisterMode) {
            usernameInput.style.display = "block";
            btnAuth.textContent = "Konto erstellen";
            togglePrompt.textContent = "Bereits ein Konto?";
            toggleAction.textContent = "Hier einloggen";
        } else {
            usernameInput.style.display = "none";
            btnAuth.textContent = "Einloggen";
            togglePrompt.textContent = "Noch kein Konto?";
            toggleAction.textContent = "Jetzt registrieren";
        }
    });

    btnAuth.addEventListener('click', () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const username = usernameInput.value.trim();

        if (!email || !password) return alert("Bitte E-Mail und Passwort eingeben!");

        if (isRegisterMode) {
            if (!username) return alert("Bitte Benutzernamen eingeben!");
            createUserWithEmailAndPassword(auth, email, password)
                .then((res) => updateProfile(res.user, { displayName: username }))
                .catch((err) => alert("Fehler: " + err.message));
        } else {
            signInWithEmailAndPassword(auth, email, password)
                .catch((err) => alert("Login fehlgeschlagen: " + err.message));
        }
    });

    document.getElementById('btn-logout').addEventListener('click', () => {
        signOut(auth);
    });

    document.getElementById('btn-show-uid').addEventListener('click', () => {
        if (auth.currentUser) {
            const uid = auth.currentUser.uid;
            navigator.clipboard.writeText(uid);
            alert("Deine User-ID (UID):\n\n" + uid);
        }
    });

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            authSection.style.display = "none";
            userDisplay.textContent = user.displayName || user.email;

            isAdmin = (user.uid === ADMIN_UID);
            adminCreateLobby.style.display = isAdmin ? "block" : "none";

            lobbySection.style.display = "block";
            voiceSection.style.display = "none";
            loadLobbies();
        } else {
            authSection.style.display = "block";
            lobbySection.style.display = "none";
            voiceSection.style.display = "none";
        }
    });

    document.getElementById('btn-create-lobby').addEventListener('click', async () => {
        const name = document.getElementById('new-lobby-name').value.trim();
        const password = document.getElementById('new-lobby-password').value.trim();

        if (!name || !password) return alert("Bitte Name und Passwort für den Raum eingeben!");

        try {
            await addDoc(collection(db, "lobbies"), {
                name: name,
                password: password
            });
            document.getElementById('new-lobby-name').value = "";
            document.getElementById('new-lobby-password').value = "";
            alert("Raum erfolgreich erstellt!");
        } catch (e) {
            alert("Fehler beim Erstellen: " + e.message);
        }
    });

    function loadLobbies() {
        onSnapshot(collection(db, "lobbies"), (snapshot) => {
            lobbyListDiv.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const lobby = docSnap.data();
                const lobbyId = docSnap.id;

                const card = document.createElement('div');
                card.className = 'lobby-card';

                let deleteBtnHtml = isAdmin ? `<button class="delete-btn" data-id="${lobbyId}">Löschen</button>` : '';

                card.innerHTML = `
                    <div class="lobby-info">
                        <strong>${escapeHtml(lobby.name)}</strong>
                    </div>
                    <div class="lobby-buttons">
                        <button class="join-btn">Beitreten</button>
                        ${deleteBtnHtml}
                    </div>
                `;

                card.querySelector('.join-btn').addEventListener('click', () => joinLobby(lobbyId, lobby.name, lobby.password));

                if (isAdmin) {
                    card.querySelector('.delete-btn').addEventListener('click', () => deleteLobby(lobbyId, lobby.name));
                }

                lobbyListDiv.appendChild(card);
            });
        });
    }

    async function deleteLobby(lobbyId, name) {
        if (confirm(`Möchtest du den Raum "${name}" löschen?`)) {
            try {
                await deleteDoc(doc(db, "lobbies", lobbyId));
                alert("Raum gelöscht.");
            } catch (e) {
                alert("Fehler beim Löschen: " + e.message);
            }
        }
    }

    async function joinLobby(lobbyId, name, correctPassword) {
        const savedLobbies = getSavedLobbies();

        if (savedLobbies[lobbyId] === correctPassword || prompt(`Passwort für Raum "${name}" eingeben:`) === correctPassword) {
            saveLobbyAccess(lobbyId, correctPassword);
            currentLobbyId = lobbyId;
            currentLobbyDisplay.textContent = name;

            lobbySection.style.display = "none";
            voiceSection.style.display = "block";

            await startVoiceConnection();
        } else {
            alert("Falsches Passwort!");
        }
    }

    async function startVoiceConnection() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            addParticipantCard(auth.currentUser.uid, auth.currentUser.displayName || auth.currentUser.email, true);
        } catch (e) {
            alert("Mikrofon-Zugriff fehlgeschlagen: " + e.message);
        }
    }

    function addParticipantCard(uid, name, isSelf = false) {
        let card = document.getElementById(`user-${uid}`);
        if (!card) {
            card = document.createElement('div');
            card.id = `user-${uid}`;
            card.className = 'participant-card';
            card.innerHTML = `
                <div class="participant-avatar">${name.charAt(0).toUpperCase()}</div>
                <div class="participant-name">${escapeHtml(name)} ${isSelf ? '(Du)' : ''}</div>
            `;
            participantsDiv.appendChild(card);
        }
    }

    document.getElementById('btn-toggle-mic').addEventListener('click', (e) => {
        if (localStream) {
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            e.currentTarget.classList.toggle('active', isMuted);
            e.currentTarget.textContent = isMuted ? '🔇' : '🎙️';
        }
    });

    document.getElementById('btn-toggle-deafen').addEventListener('click', (e) => {
        isDeafened = !isDeafened;
        const audioElements = document.querySelectorAll('#audio-containers audio');
        audioElements.forEach(audio => audio.muted = isDeafened);
        e.currentTarget.classList.toggle('active', isDeafened);
        e.currentTarget.textContent = isDeafened ? '🔇' : '🎧';
    });

    document.getElementById('btn-leave-lobby').addEventListener('click', () => {
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }

        currentLobbyId = null;
        participantsDiv.innerHTML = "";
        voiceSection.style.display = "none";
        lobbySection.style.display = "block";
        loadLobbies();
    });

    function escapeHtml(str) {
        return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : "";
    }
</script>

</body>
</html>
